name = "sale1"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ============================================================
# แก้ค่า account_id เป็นของคุณ (รันคำสั่ง: wrangler whoami)
# ============================================================
# account_id = "YOUR_ACCOUNT_ID"

[[d1_databases]]
binding = "sale1"
database_name = "sale1"
database_id = "91dc223e-08a2-426a-9355-d94ed1c2d32f"

[vars]
# ADMIN_TOKEN ตั้งผ่าน wrangler secret แทน (ห้ามใส่ที่นี่)
