<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แอดมิน — ข้าวซอย 90</title>
  <link rel="stylesheet" href="admin.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=Mitr:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>/* prevent flash */(function(){var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t);})();</script>
</head>
<body>
<div class="admin-app">

  <!-- =============== LOGIN =============== -->
  <div id="loginScreen" class="screen">
    <div class="login-wrap">
      <div class="login-card">
        <div class="login-icon">🍛</div>
        <h1 class="login-title">ข้าวซอย 90</h1>
        <p class="login-sub">เข้าสู่ระบบแอดมิน</p>
        <div id="loginForm" class="login-form">
          <div class="field">
            <label class="field-label" for="username">ชื่อผู้ใช้</label>
            <input class="field-input" type="text" id="username" autocomplete="username" placeholder="username">
          </div>
          <div class="field">
            <label class="field-label" for="password">รหัสผ่าน</label>
            <input class="field-input" type="password" id="password" autocomplete="current-password" placeholder="••••••">
          </div>
          <p id="loginError" class="login-error" aria-live="polite"></p>
          <button type="button" class="btn btn-primary btn-block" id="loginBtn">เข้าสู่ระบบ</button>
        </div>
        <a href="index.html" class="back-link">← กลับไปหน้า POS</a>
      </div>
    </div>
  </div>

  <!-- =============== DASHBOARD =============== -->
  <div id="dashboardScreen" class="screen hidden">

    <!-- Header -->
    <header class="admin-header">
      <div class="admin-header-left">
        <h1 class="admin-logo">🍛 แอดมิน</h1>
        <span class="admin-user-chip" id="adminUserChip">Admin</span>
      </div>
      <div class="admin-header-right">
        <div class="sound-control" id="soundControl">
          <button type="button" class="btn-sound-icon" id="soundToggleBtn" title="กดเพื่อเปิด/ปิด • กดค้างเพื่อเลือกโหมด">🔔</button>
          <div class="sound-dropdown" id="soundDropdown">
            <div class="sound-dropdown-label">🎚 เลือกโหมดเสียง</div>
            <button class="sound-dropdown-item active" data-mode="tts">🗣 เสียงคนพูด</button>
            <button class="sound-dropdown-item" data-mode="beep">🎵 Effect</button>
          </div>
        </div>
        <a href="backoffice.html" class="btn btn-outline">📊 Backoffice</a>
        <a href="index.html" class="btn btn-outline">POS</a>
        <button type="button" class="btn btn-outline" id="logoutBtn">ออกจากระบบ</button>
        <button type="button" class="btn btn-ghost dark-toggle" id="darkToggleBtn" title="Dark Mode">🌙</button>
      </div>
    </header>

    <main class="admin-main">

      <!-- Summary cards -->
      <section class="summary-section">
        <div class="summary-card">
          <span class="summary-icon">🧾</span>
          <div>
            <div class="summary-label">ออเดอร์วันนี้ (จ่ายแล้ว)</div>
            <div class="summary-value" id="todayOrderCount">0</div>
          </div>
        </div>
        <div class="summary-card accent">
          <span class="summary-icon">💰</span>
          <div>
            <div class="summary-label">ยอดรวมวันนี้</div>
            <div class="summary-value" id="todayTotal">฿0.00</div>
          </div>
        </div>
      </section>

      <!-- Tabs -->
      <nav class="tab-nav">
        <button class="tab-btn active" data-tab="recent">รายการล่าสุด</button>
      </nav>

      <!-- Tab: Recent -->
      <div id="tabRecent" class="tab-panel">
        <div id="ordersList" class="orders-list"></div>
        <div id="ordersEmpty" class="empty-state hidden">
          <p class="empty-icon">📋</p>
          <p>ยังไม่มีรายการสั่งซื้อ</p>
          <a href="index.html" class="link">ไปที่ POS →</a>
        </div>
      </div>

      
  </div>


  <!-- =============== MODAL: Edit Order =============== -->
  <div class="modal" id="editOrderModal" aria-hidden="true">
    <div class="modal-box" style="max-width:560px">

      <!-- View: แก้ไขรายการ -->
      <div id="editOrderView">
        <h3 class="modal-title">✏️ แก้ไขออเดอร์</h3>
        <p class="modal-desc" id="editOrderDesc"></p>
        <div class="edit-order-batches" id="editOrderBatches"></div>
        <div class="edit-order-grand-total" id="editOrderTotal"></div>
        <p id="editOrderError" class="login-error" aria-live="polite"></p>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" id="editOrderCancel">ยกเลิก</button>
          <button type="button" class="btn btn-outline" id="editOpenAddView">＋ เพิ่มเมนู</button>
          <button type="button" class="btn btn-primary" id="editOrderSave">💾 บันทึก</button>
        </div>
      </div>

      <!-- View: เพิ่มเมนู (inside edit modal) -->
      <div id="editAddItemView" class="hidden">
        <h3 class="modal-title">🍽 เพิ่มเมนูในออเดอร์</h3>
        <p class="modal-desc" id="editAddItemDesc"></p>
        <div id="editAddItemProductList" class="add-item-product-list"></div>
        <p id="editAddItemToastMsg" class="add-item-toast"></p>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" id="editBackToOrder">← กลับแก้ไข</button>
        </div>
      </div>

    </div>
  </div>

</div>
<script type="module" src="admin.js"></script>
</body>
</html>
