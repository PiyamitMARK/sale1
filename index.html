<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ข้าวซอย 90 — ระบบ POS</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=Mitr:wght@600;700&display=swap" rel="stylesheet">
  <script>/* prevent flash */(function(){var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t);})();</script>
</head>
<body>
  <div class="app">

    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <h1 class="logo">🍛 ข้าวซอย 90</h1>
      </div>
      <div class="header-right">
        <div class="header-info">
          <span id="currentDate" class="date-text"></span>
          <span class="order-chip">ออเดอร์ #<span id="orderNumber">1001</span><span id="tableChip"></span></span>
        </div>
        <button type="button" class="btn btn-ghost dark-toggle" id="darkToggleBtn" title="Dark Mode">🌙</button>
        <a href="admin.html" class="admin-btn" title="หน้าแอดมิน">⚙️</a>
      </div>
    </header>

    <main class="main">

      <!-- Left: Products -->
      <section class="products-section">

        <!-- Table selector (จำนวนโต๊ะ sync กับ qr.html ผ่าน localStorage) -->
        <div class="table-bar">
          <span class="table-bar-label">🪑 เลือกโต๊ะ</span>
          <div class="table-grid" id="tableGrid">
            <!-- rendered by app.js จาก localStorage ks90-table-count -->
          </div>
        </div>

        <!-- Overlay เมื่อยังไม่เลือกโต๊ะ -->
        <div class="products-overlay" id="productsOverlay">
          <div class="overlay-msg">
            <span class="overlay-icon">🪑</span>
            <span>กรุณาเลือกโต๊ะก่อน</span>
          </div>
        </div>

        <!-- Category tabs — rendered dynamically by app.js -->
        <nav class="categories" id="categoriesNav"></nav>

        <!-- Products grid -->
        <div class="products-grid" id="productsGrid"></div>
      </section>

      <!-- Right: Cart -->
      <aside class="cart-section">
        <div class="cart-header">
          <div class="cart-title-row">
            <h2 class="cart-title">รายการสั่ง <span class="cart-badge" id="cartBadge" style="display:none">0</span></h2>
          </div>
        </div>

        <ul class="cart-items" id="cartItems">
          <li class="cart-empty" id="cartEmpty">
            <span class="cart-empty-icon">🛒</span>
            <span>ยังไม่มีรายการ</span>
          </li>
        </ul>

        <div class="cart-footer">
          <div class="totals">
            <div class="total-row">
              <span>รวมทั้งหมด</span>
              <span class="total-amount" id="total">฿0.00</span>
            </div>
          </div>
          <div class="cart-actions">
            <button type="button" class="btn btn-ghost" id="clearCart">🗑 ล้าง</button>
            <button type="button" class="btn btn-primary" id="completeOrder">✓ สั่งซื้อ</button>
          </div>
        </div>
      </aside>
    </main>

    <!-- Confirm Modal -->
    <div class="modal" id="confirmOrderModal" aria-hidden="true">
      <div class="modal-content confirm-content">
        <h3 class="modal-title">ยืนยันสั่งซื้อ</h3>
        <p id="confirmTableLabel" class="confirm-table-label"></p>
        <div class="confirm-order-list" id="confirmOrderList"></div>
        <div class="confirm-total" id="confirmTotal"></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="confirmOrderCancel">ยกเลิก</button>
          <button type="button" class="btn btn-primary" id="confirmOrderOk">✓ ยืนยัน</button>
        </div>
      </div>
    </div>

    <!-- Option / Topping Modal -->
    <div class="modal" id="optionModal" aria-hidden="true">
      <div class="modal-content option-modal-content">
        <!-- content rendered dynamically by app.js -->
      </div>
    </div>

    <!-- Receipt Modal -->
    <div class="modal" id="receiptModal" aria-hidden="true">
      <div class="modal-content receipt-modal-content">
        <div class="receipt" id="receiptContent">
          <div class="receipt-header">
            <p class="receipt-shop">ข้าวซอย 90</p>
            <p class="receipt-order">ออเดอร์ #<span id="receiptOrderNum"></span></p>
            <p class="receipt-table" id="receiptTable"></p>
            <p class="receipt-date" id="receiptDate"></p>
          </div>
          <div class="receipt-divider">--------------------------------</div>
          <div class="receipt-items" id="receiptItems"></div>
          <div class="receipt-divider">--------------------------------</div>
          <div class="receipt-total-row">
            <span>รวมทั้งหมด</span>
            <span id="receiptTotal"></span>
          </div>
          <p class="receipt-footer">ขอบคุณที่ใช้บริการ 🙏</p>
        </div>
        <div class="modal-actions no-print">
          <button type="button" class="btn btn-ghost" id="printReceipt">🖨 พิมพ์</button>
          <button type="button" class="btn btn-primary" id="newOrder">ออเดอร์ใหม่</button>
        </div>
      </div>
    </div>

  </div>
  <!-- Auth Guard -->
  <script>
    (function () {
      var key = localStorage.getItem('ks90-admin-key');
      if (!key) { location.replace('admin.html?next=index.html'); return; }
      var hasFlag = localStorage.getItem('kaosoi-auth') === 'true'
                 || sessionStorage.getItem('kaosoi-auth') === 'true';
      if (!hasFlag) {
        fetch('/api/meta', { headers: { 'X-Admin-Key': key } }).then(function (r) {
          if (r.ok) {
            localStorage.setItem('kaosoi-auth', 'true');
            sessionStorage.setItem('kaosoi-auth', 'true');
          } else {
            localStorage.removeItem('ks90-admin-key');
            location.replace('admin.html?next=index.html');
          }
        }).catch(function () { /* network err — key ยังอยู่, ให้ app.js จัดการต่อ */ });
      }
    })();
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
