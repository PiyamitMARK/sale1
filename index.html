<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ข้าวซอย 90 — ระบบ POS</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Mitr:wght@500;600;700&display=swap" rel="stylesheet">
  <script>/* prevent flash */(function(){var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t);})();</script>
</head>
<body>
  <div class="app">

    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <h1 class="logo">🍛 ข้าวซอย 90</h1>
      </div>
      <div class="header-right">
        <div class="header-info">
          <span id="currentDate" class="date-text"></span>
          <span class="order-chip">ออเดอร์ #<span id="orderNumber">1001</span><span id="tableChip"></span></span>
        </div>
        <button type="button" class="btn btn-ghost dark-toggle" id="darkToggleBtn" title="Dark Mode">🌙</button>
        <a href="admin.html" class="admin-btn" title="หน้าแอดมิน">⚙️</a>
      </div>
    </header>

    <main class="main">

      <!-- Left: Products -->
      <section class="products-section">

        <!-- Table selector -->
        <div class="table-bar">
          <span class="table-bar-label">🪑 เลือกโต๊ะ</span>
          <div class="table-grid">
            <button class="table-btn" data-table="1">1</button>
            <button class="table-btn" data-table="2">2</button>
            <button class="table-btn" data-table="3">3</button>
            <button class="table-btn" data-table="4">4</button>
            <button class="table-btn" data-table="5">5</button>
            <button class="table-btn" data-table="6">6</button>
            <button class="table-btn" data-table="7">7</button>
            <button class="table-btn" data-table="8">8</button>
            <button class="table-btn" data-table="9">9</button>
          </div>
        </div>

        <!-- Overlay เมื่อยังไม่เลือกโต๊ะ -->
        <div class="products-overlay" id="productsOverlay">
          <div class="overlay-msg">
            <span class="overlay-icon">🪑</span>
            <span>กรุณาเลือกโต๊ะก่อน</span>
          </div>
        </div>

        <!-- Category tabs — rendered dynamically by app.js -->
        <nav class="categories" id="categoriesNav"></nav>

        <!-- Products grid -->
        <div class="products-grid" id="productsGrid"></div>
      </section>

      <!-- Right: Cart -->
      <aside class="cart-section">
        <div class="cart-header">
          <div class="cart-title-row">
            <h2 class="cart-title">รายการสั่ง <span class="cart-badge" id="cartBadge" style="display:none">0</span></h2>
          </div>
        </div>

        <ul class="cart-items" id="cartItems">
          <li class="cart-empty" id="cartEmpty">
            <span class="cart-empty-icon">🛒</span>
            <span>ยังไม่มีรายการ</span>
          </li>
        </ul>

        <div class="cart-footer">
          <div class="totals">
            <div class="total-row">
              <span>รวมทั้งหมด</span>
              <span class="total-amount" id="total">฿0.00</span>
            </div>
          </div>
          <div class="cart-actions">
            <button type="button" class="btn btn-ghost" id="clearCart">🗑 ล้าง</button>
            <button type="button" class="btn btn-primary" id="completeOrder">✓ สั่งซื้อ</button>
          </div>
        </div>
      </aside>
    </main>

    <!-- Confirm Modal -->
    <div class="modal" id="confirmOrderModal" aria-hidden="true">
      <div class="modal-content confirm-content">
        <h3 class="modal-title">ยืนยันสั่งซื้อ</h3>
        <p id="confirmTableLabel" class="confirm-table-label"></p>
        <div class="confirm-order-list" id="confirmOrderList"></div>
        <div class="confirm-total" id="confirmTotal"></div>

        <!-- Payment Method -->
        <div class="payment-method-section">
          <p class="payment-method-label">💳 วิธีชำระเงิน</p>
          <div class="payment-method-grid">
            <label class="payment-option">
              <input type="radio" name="paymentMethod" value="cash" checked>
              <span class="payment-option-card">
                <span class="payment-option-icon">💵</span>
                <span class="payment-option-text">เงินสด</span>
              </span>
            </label>
            <label class="payment-option">
              <input type="radio" name="paymentMethod" value="qr">
              <span class="payment-option-card">
                <span class="payment-option-icon">📱</span>
                <span class="payment-option-text">QR / PromptPay</span>
              </span>
            </label>
            <label class="payment-option">
              <input type="radio" name="paymentMethod" value="credit">
              <span class="payment-option-card">
                <span class="payment-option-icon">💳</span>
                <span class="payment-option-text">บัตรเครดิต</span>
              </span>
            </label>
            <label class="payment-option">
              <input type="radio" name="paymentMethod" value="transfer">
              <span class="payment-option-card">
                <span class="payment-option-icon">🏦</span>
                <span class="payment-option-text">โอนธนาคาร</span>
              </span>
            </label>
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="confirmOrderCancel">ยกเลิก</button>
          <button type="button" class="btn btn-primary" id="confirmOrderOk">✓ ยืนยัน</button>
        </div>
      </div>
    </div>

    <!-- Option / Topping Modal -->
    <div class="modal" id="optionModal" aria-hidden="true">
      <div class="modal-content option-modal-content">
        <!-- content rendered dynamically by app.js -->
      </div>
    </div>

    <!-- Receipt Modal -->
    <div class="modal" id="receiptModal" aria-hidden="true">
      <div class="modal-content receipt-modal-content">
        <div class="receipt" id="receiptContent">
          <div class="receipt-header">
            <p class="receipt-shop">ข้าวซอย 90</p>
            <p class="receipt-order">ออเดอร์ #<span id="receiptOrderNum"></span></p>
            <p class="receipt-table" id="receiptTable"></p>
            <p class="receipt-date" id="receiptDate"></p>
          </div>
          <div class="receipt-divider">--------------------------------</div>
          <div class="receipt-items" id="receiptItems"></div>
          <div class="receipt-divider">--------------------------------</div>
          <div class="receipt-total-row">
            <span>รวมทั้งหมด</span>
            <span id="receiptTotal"></span>
          </div>
          <p class="receipt-footer">ขอบคุณที่ใช้บริการ 🙏</p>
        </div>
        <div class="modal-actions no-print">
          <button type="button" class="btn btn-ghost" id="printReceipt">🖨 พิมพ์</button>
          <button type="button" class="btn btn-primary" id="newOrder">ออเดอร์ใหม่</button>
        </div>
      </div>
    </div>

  </div>
  <!-- Auth Guard: ป้องกันลูกค้าเข้า POS โดยตรง -->
  <script>
    (function() {
      if (localStorage.getItem('krua-khun-mae-auth') !== 'true' && sessionStorage.getItem('krua-khun-mae-auth') !== 'true') {
        document.body.innerHTML = [
          '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;',
          'justify-content:center;font-family:Sarabun,sans-serif;background:#faf6f0;',
          'color:#3d2b1f;text-align:center;padding:2rem">',
          '<div style="font-size:3.5rem;margin-bottom:1rem">🔒</div>',
          '<h2 style="font-family:Mitr,sans-serif;font-size:1.5rem;margin-bottom:0.5rem">',
          'ไม่มีสิทธิ์เข้าใช้งาน</h2>',
          '<p style="color:#8b6655;margin-bottom:1.5rem">',
          'หน้านี้สำหรับพนักงานเท่านั้น<br>กรุณาล็อกอินผ่านหน้าแอดมินก่อน</p>',
          '<a href="admin.html" style="background:#c8853a;color:#fff;text-decoration:none;',
          'padding:0.65rem 1.75rem;border-radius:999px;',
          'font-family:Mitr,sans-serif;font-size:0.95rem;font-weight:600">',
          'ไปหน้าล็อกอิน →</a></div>'
        ].join('');
      }
    })();
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
